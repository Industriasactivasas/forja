const ANIMS=[];
function figSVG(id,size=110,cls=''){return `<svg class="fig ${cls}" data-ex="${id}" viewBox="0 -20 200 210" width="${size}" height="${size}"></svg>`}
function mountFigs(root=document){
 root.querySelectorAll('svg.fig:not([data-m])').forEach(svg=>{
  svg.setAttribute('data-m',1);const id=svg.dataset.ex;const P=POSES[id];if(!P)return;
  const ns='http://www.w3.org/2000/svg';const mk=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
  mk('line',{x1:0,y1:184,x2:200,y2:184,stroke:'#3a4354','stroke-width':3});
  if(P.prop==='wall')mk('rect',{x:84,y:40,width:8,height:144,fill:'#3a4354'});
  if(P.prop==='wall2')mk('rect',{x:150,y:60,width:8,height:124,fill:'#3a4354'});
  const L=(c,w)=>mk('line',{stroke:c,'stroke-width':w,'stroke-linecap':'round'});
  const back='#ff7a1a88',front='#ffb36b',body='#ffd9b3';
  const segs=[['p','k2',back,9],['k2','f2',back,8],['n','e2',back,8],['e2','w2',back,7],['n','p',body,12],['p','k1',front,10],['k1','f1',front,9],['n','e1',front,8],['e1','w1',front,7]].map(s=>({a:s[0],b:s[1],el:L(s[2],s[3])}));
  const head=mk('circle',{r:11,fill:body});
  ANIMS.push({svg,id,segs,head,t0:performance.now()-Math.random()*500});
 });
}
function poseAt(id,t){const P=POSES[id],n=P.f.length,x=(((t%P.d)+P.d)%P.d)/P.d*n,i=Math.floor(x);let u=x-i;u=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;const a=P.f[i],b=P.f[(i+1)%n],o={};for(const k of J)o[k]=[a[k][0]+(b[k][0]-a[k][0])*u,a[k][1]+(b[k][1]-a[k][1])*u];return o}
function loop(now){
 for(let i=ANIMS.length-1;i>=0;i--){const A=ANIMS[i];if(!A.svg.isConnected){ANIMS.splice(i,1);continue}
  let o;try{o=poseAt(A.id,now-A.t0)}catch(e){continue}for(const s of A.segs){s.el.setAttribute('x1',o[s.a][0]);s.el.setAttribute('y1',o[s.a][1]);s.el.setAttribute('x2',o[s.b][0]);s.el.setAttribute('y2',o[s.b][1])}
  A.head.setAttribute('cx',o.h[0]);A.head.setAttribute('cy',o.h[1])}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);

const TYPES={A:{t:'Fuerza · Piernas y core',i:'🦵'},B:{t:'Fuerza · Empuje y espalda',i:'💪'},C:{t:'Metabólico HIIT',i:'🔥'},D:{t:'Cuerpo completo',i:'⚡'},M:{t:'Movilidad + core',i:'🧘'},R:{t:'Recuperación activa',i:'🚶'}};
const WEEK={3:['A','M','B','M','C','M','R'],4:['A','B','M','C','D','M','R'],5:['A','B','C','M','D','C','R'],6:['A','B','C','D','A','C','R']};

/* =================== ANÁLISIS CORPORAL =================== */
function analyze(p){
 const h=+p.altura,w=+p.peso,a=+p.edad,male=p.sexo==='h';
 const bmi=w/((h/100)**2);
 let bf=null;
 if(p.cintura&&p.cuello){
  if(male&&p.cintura-p.cuello>0)bf=495/(1.0324-0.19077*Math.log10(p.cintura-p.cuello)+0.15456*Math.log10(h))-450;
  if(!male&&p.cadera&&(+p.cintura+ +p.cadera-p.cuello)>0)bf=495/(1.29579-0.35004*Math.log10(+p.cintura+ +p.cadera-p.cuello)+0.221*Math.log10(h))-450;
  if(bf!==null&&(bf<3||bf>60))bf=null;
 }
 const whtr=p.cintura?p.cintura/h:null;
 const bmr=10*w+6.25*h-5*a+(male?5:-161);
 const act=Math.min(1.9,+p.actividad+0.025*(+p.dias));
 const tdee=bmr*act;
 const gf={perder:0.8,recomp:0.9,ganar:1.1}[p.objetivo];
 let kcal=Math.round(tdee*gf/10)*10;kcal=Math.max(kcal,male?1500:1200,Math.round(bmr/10)*10);
 const ref=bmi>30?25*(h/100)**2:w;
 const prot=Math.round(ref*(p.objetivo==='ganar'?1.8:2.0));
 const fat=Math.round(kcal*0.27/9);
 const carb=Math.max(50,Math.round((kcal-prot*4-fat*9)/4));
 const water=r1(w*0.035+0.5);
 const pts=(p.flex<5?0:p.flex<15?1:2)+(p.sent<25?0:p.sent<40?1:2)+(p.plank<30?0:p.plank<60?1:2);
 const lvl=pts<=1?0:pts<=4?1:2;
 const leanMass=bf!==null?w*(1-bf/100):null;
 const notes=[];
 const bmiC=bmi<18.5?['Bajo peso','warn']:bmi<25?['Normal','ok']:bmi<30?['Sobrepeso','warn']:['Obesidad','bad'];
 let bfC=null;if(bf!==null){const t=male?[14,20,25]:[21,28,32];bfC=bf<t[0]?['Atlético','ok']:bf<t[1]?['En forma','ok']:bf<t[2]?['Promedio','warn']:['Alto','bad']}
 const whC=whtr===null?null:whtr<0.5?['Saludable','ok']:whtr<0.6?['Riesgo aumentado','warn']:['Riesgo alto','bad'];
 if(whtr&&whtr>=0.5)notes.push(`Tu cintura es el ${Math.round(whtr*100)}% de tu estatura. La meta es menos del 50% (≤ ${Math.round(h*0.5)} cm). La grasa abdominal es la de mayor riesgo metabólico: <b>prioridad #1 es bajarla</b>.`);
 if(bf!==null&&bfC[1]==='bad'&&p.objetivo==='ganar')notes.push('Con tu % de grasa actual, conviene empezar con <b>recomposición</b> (déficit leve + fuerza) antes de un superávit para ganar músculo.');
 if(p.flex<5)notes.push('Tu fuerza de empuje es baja: empezarás con flexiones con rodillas. En 4–6 semanas deberías hacer flexiones completas.');
 if(p.plank<30)notes.push('Core débil (plancha < 30 s): protegerá tu espalda fortalecerlo. Cada día lleva trabajo de core.');
 if(p.sent<25)notes.push('Resistencia de piernas baja: las sentadillas serán tu base.');
 if(+p.actividad<=1.2)notes.push('Eres muy sedentario fuera del entrenamiento: los <b>pasos diarios</b> queman más que el ejercicio mismo. No los ignores.');
 if(p.objetivo==='perder'||p.objetivo==='recomp')notes.push(`Ritmo realista y sostenible: perder ~${r1(w*0.006)} kg/semana (0,5–1% del peso). Más rápido = pierdes músculo y rebote.`);
 if(p.objetivo==='ganar')notes.push('Ganancia realista de un principiante: 0,5–1 kg de músculo al mes los primeros meses, con proteína alta y progresión.');
 return {bmi,bf,whtr,bmr,tdee,kcal,prot,fat,carb,water,lvl,pts,leanMass,bmiC,bfC,whC,notes,steps:p.objetivo==='perder'?10000:8000};
}

/* =================== GENERADOR DE RUTINAS =================== */
function progInfo(key=today()){const idx=Math.max(0,diffDays(S.start,key));const week=Math.floor(idx/7)+1;const phase=week<=4?0:week<=8?1:2;const bonus=week>12?1+0.05*Math.floor((week-13)/4+1):1;const type=WEEK[S.p.dias][idx%7];return {idx,week,phase,bonus,type,day:idx+1}}
function sub(id){for(const z of (S.p.lesiones||[])){if(SUBS[z]&&SUBS[z][id])id=SUBS[z][id]}return id}
function dose(id,lvl,mult){if(REPS[id])return {mode:'reps',reps:Math.max(3,Math.round(REPS[id][lvl]*mult))};return {mode:'time',secs:Math.max(10,Math.round(SECS[id][lvl]*mult/5)*5)}}
function estimate(steps){return steps.reduce((t,s)=>t+(s.kind==='rest'?s.secs:s.mode==='time'?s.secs:s.reps*(EX[s.ex].side?7:3.5)),0)}
function warmup(){const L=[['jack',30],['bisagra',30],['sentadilla',30],['birddog',30],['rodillas',20]];const out=[];L.forEach(([id,s],i)=>{id=sub(id);out.push({kind:'work',ex:id,mode:'time',secs:s,label:'Calentamiento '+(i+1)+'/'+L.length,ph:'Calentamiento'});out.push({kind:'rest',secs:5,ph:'Calentamiento'})});return out}
function cooldown(){return [{kind:'work',ex:'respiracion',mode:'time',secs:90,label:'Vuelta a la calma',ph:'Vuelta a la calma'}]}
function buildWorkout(type,info=progInfo()){
 const lvl=S.lvl,ph=info.phase,mult=(1+0.15*ph)*info.bonus*(S.adj||1);
 const title=TYPES[type].i+' '+TYPES[type].t;
 let main=[];
 if(type==='C'){
  const exs=[['jack','sentadilla','escalador','rodillas','plancha'],['jack','escalador','sentadilla','rodillas','flexion_rod','burpee'],['burpee','sent_salto','escalador','rodillas','flexion','jack']][lvl].map(sub);
  const wr=[[20,40],[30,30],[40,20]][lvl===0?Math.min(ph,1):ph];let rounds=[3,4,5][lvl];
  const mk=r=>{const o=[];for(let k=1;k<=r;k++){exs.forEach((id,j)=>{o.push({kind:'work',ex:id,mode:'time',secs:wr[0],label:`Ronda ${k}/${r} · ${j+1}/${exs.length}`,ph:'HIIT',hiit:1});o.push({kind:'rest',secs:wr[1],ph:'HIIT'})});if(k<r)o.push({kind:'rest',secs:60,ph:'Descanso entre rondas'})}return o};
  main=mk(rounds);while(rounds>2&&estimate(main)>(S.p.minutos-6)*60){rounds--;main=mk(rounds)}
 } else {
  let exs={A:[lvl===2?'sent_salto':'sentadilla','zancada','puente','pared','talones','deadbug'],B:lvl===0?['flexion_rod','superman','plancha','birddog','plancha_lat']:['flexion','pica','superman','plancha','plancha_lat','birddog'],D:[lvl===0?'flexion_rod':'flexion','sentadilla','superman','zancada','escalador','plancha'],M:['bisagra','birddog','deadbug','puente','plancha_lat'],R:['bisagra','birddog','deadbug','puente']}[type].map(sub);
  exs=[...new Set(exs)];
  const light=type==='M'||type==='R';
  const sets=light?(type==='R'?1:2):[[2,3,3],[3,3,4],[3,4,4]][lvl][ph];
  const rest=light?20:[60,45,30][ph]+(lvl===0?15:0);
  const mk=list=>{const o=[];list.forEach((id,j)=>{const d=dose(id,lvl,light?mult*0.8:mult);for(let s=1;s<=sets;s++){o.push({kind:'work',ex:id,...d,label:`Ejercicio ${j+1}/${list.length} · Serie ${s}/${sets}`,ph:'Bloque principal'});o.push({kind:'rest',secs:rest,ph:'Descanso'})}});return o};
  main=mk(exs);while(exs.length>4&&estimate(main)>(S.p.minutos-6)*60){exs.pop();main=mk(exs)}
 }
 if(main.length&&main[main.length-1].kind==='rest')main.pop();
 const steps=[...warmup(),...main,...cooldown()];
 return {title,type,steps,mins:Math.round(estimate(steps)/60)};
}
function buildMin(){const lvl=S.lvl;const exs=['jack','sentadilla',lvl===0?'flexion_rod':'flexion','plancha','escalador'].map(sub);const o=[];for(let r=1;r<=2;r++)exs.forEach((id,j)=>{o.push({kind:'work',ex:id,mode:'time',secs:35,label:`Mínimo · Ronda ${r}/2 · ${j+1}/5`,ph:'Plan mínimo'});o.push({kind:'rest',secs:10,ph:'Plan mínimo'})});o.pop();return {title:'⏱️ Plan mínimo innegociable',type:'MIN',steps:o,mins:Math.round(estimate(o)/60)}}
const uniqEx=w=>[...new Set(w.steps.filter(s=>s.kind==='work'&&s.ph!=='Calentamiento'&&s.ph!=='Vuelta a la calma').map(s=>s.ex))];

/* =================== DÍAS, RACHAS, HÁBITOS =================== */
function D(k=today()){S.days=S.days||{};if(!S.days[k])S.days[k]={w:0,min:0,h:{},mood:0,j:{}};return S.days[k]}
const done=k=>{const d=S.days&&S.days[k];return !!(d&&(d.w||d.min))};
function streak(){let k=today();if(!done(k))k=addDays(k,-1);let n=0;while(diffDays(S.start,k)>=0&&done(k)){n++;k=addDays(k,-1)}return n}
function bestStreak(){let b=0,c=0;for(let k=S.start;diffDays(k,today())>=0;k=addDays(k,1)){if(done(k)){c++;b=Math.max(b,c)}else c=0}return b}
function habits(){const A=S.A;return [
 ['pasos',`Caminar ${A.steps.toLocaleString('es')} pasos`],
 ['agua',`Beber ${A.water} L de agua`],
 ['prot',`Comer ${A.prot} g de proteína (proteína en cada comida)`],
 ['verdura','Verduras en almuerzo y cena (½ plato)'],
 ['azucar','Cero bebidas azucaradas y cero alcohol'],
 ['respira','Respiración consciente 5 min','mente'],
 ['diario','Diario: 3 líneas','mente'],
 ['sueno','Dormir 7–9 h (pantallas fuera 1 h antes)']]}
function dayScore(k=today()){const d=D(k);const H=habits();const hd=H.filter(h=>d.h[h[0]]).length;return Math.round(((d.w||d.min?1:0)*40)+hd/H.length*60)}

const XPV={w:100,min:40,habit:10,full:30,log:30,test:100,miss:-60};
function xpInfo(){
 let xp=0,c=0,todayXp=0;const H=habits().map(h=>h[0]);
 for(let k=S.start;diffDays(k,today())>=0;k=addDays(k,1)){
  const d=S.days&&S.days[k];let g=0;
  if(d){g+=d.w?XPV.w:d.min?XPV.min:0;const hd=H.filter(h=>d.h[h]).length;g+=hd*XPV.habit;if((d.w||d.min)&&hd===H.length)g+=XPV.full}
  if(done(k)){c++;g+=Math.min(c,30)*2}else{c=0;if(k!==today())g+=XPV.miss}
  xp=Math.max(0,xp+g);if(k===today())todayXp=g;
 }
 xp+=Math.max(0,(S.logs||[]).length-1)*XPV.log+Math.max(0,(S.tests||[]).length-1)*XPV.test;
 let r=0;for(let i=0;i<RANKS.length;i++)if(xp>=RANKS[i].xp)r=i;
 const lo=RANKS[r].xp,hi=r<RANKS.length-1?RANKS[r+1].xp:null;
 let div=null,next=hi,prog=1;
 if(hi!==null){const step=(hi-lo)/3;const di=Math.min(2,Math.floor((xp-lo)/step));div=['III','II','I'][di];next=Math.round(lo+step*(di+1));const base=lo+step*di;prog=(xp-base)/(next-base)}
 return {xp,r,div,next,prog,todayXp,key:r*3+(div?['III','II','I'].indexOf(div):0)};
}
const rankName=x=>RANKS[x.r].n+(x.div?' '+x.div:'');

function obNav(dir){
 const p=OB.p;const g=id=>{const e=$('#f_'+id);return e?e.value.trim():undefined};
 const need=(ids)=>{for(const i of ids){const v=g(i);if(v===''||v===undefined){alert('Completa: '+i);return false}}return true};
 if(dir>0){
  if(OB.step===0){if(!need(['nombre','edad','altura','peso']))return;Object.assign(p,{nombre:g('nombre'),sexo:g('sexo'),edad:+g('edad'),altura:+g('altura'),peso:+g('peso')});if(p.altura<120||p.altura>230||p.peso<30||p.peso>300){alert('Revisa altura (cm) y peso (kg).');return}}
  if(OB.step===1){if(!need(p.sexo==='m'?['cintura','cuello','cadera']:['cintura','cuello']))return;p.cintura=+g('cintura');p.cuello=+g('cuello');if(p.sexo==='m')p.cadera=+g('cadera')}
  if(OB.step===2){if(!need(['flex','sent','plank']))return;p.flex=+g('flex');p.sent=+g('sent');p.plank=+g('plank')}
  if(OB.step===3){Object.assign(p,{objetivo:g('objetivo'),actividad:g('actividad'),dias:g('dias'),minutos:+g('minutos'),lesiones:[...document.querySelectorAll('.f_les:checked')].map(e=>e.value)})}
  if(OB.step===4){p.why=g('why');p.hora=g('hora');if(!p.why){alert('Escribe tu porqué. Es lo que te va a sostener los días difíciles.');return}if(!g('firma')){alert('Firma tu contrato.');return}
   S={p,start:today(),signed:g('firma'),days:{},logs:[{d:today(),peso:p.peso,cintura:p.cintura}],tests:[{d:today(),flex:p.flex,sent:p.sent,plank:p.plank}],sessions:[],adj:1,voz:true,splash:today()};
   S.A=analyze(p);S.lvl=S.A.lvl;save();TAB='cuerpo';render();return}
 }
 OB.step=Math.max(0,OB.step+dir);renderOnboarding();
}

 if(s.kind==='rest'){const n=PL.w.steps[PL.i+1];speak('Descansa. Siguiente: '+(n?EX[n.ex].n:'final'))}

  tests:(o.tests||[]).filter(t=>DRE.test(t.d)).map(t=>({d:t.d,flex:N(t.flex),sent:N(t.sent),plank:N(t.plank)})),
  sessions:(o.sessions||[]).filter(s=>DRE.test(s.d)).map(s=>({d:s.d,t:clean(s.t),min:N(s.min),f:s.f?clean(s.f):undefined})),
  photos:(o.photos||[]).filter(x=>DRE.test(x.d)&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(x.img)).slice(0,16),
  adj:Math.min(1.5,Math.max(0.7,N(o.adj,1))),voz:o.voz!==false,lvl:[0,1,2].includes(o.lvl)?o.lvl:0,rk:N(o.rk,0),splash:DRE.test(o.splash)?o.splash:undefined,A:analyze(P)}}
function importD(inp){const f=inp.files[0];if(!f)return;if(f.size>8e6){alert('Archivo demasiado grande.');return}f.text().then(t=>{try{S=sanitizeState(JSON.parse(t));save();closeL();render();alert('Datos importados.')}catch(e){alert('Archivo no válido.')}})}
function resetAll(){if(confirm('¿Seguro? Se borra todo tu progreso de este navegador. No se puede deshacer.')){localStorage.removeItem(KEY);S=null;closeL();OB.step=0;render()}}

render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
