const FB_VER='10.12.2',FB_CFG={apiKey:'AIzaSyB81akjrxLj262u1WrWy1_qd_Qba10OmoU',authDomain:'forja-ecb92.firebaseapp.com',projectId:'forja-ecb92',storageBucket:'forja-ecb92.firebasestorage.app',messagingSenderId:'467101732270',appId:'1:467101732270:web:038ec8f0912f048c078c3f'};

 let db;try{db=FS.initializeFirestore(app,{localCache:FS.persistentLocalCache({tabManager:FS.persistentMultipleTabManager()})})}catch(e){db=FS.getFirestore(app)}
 FB={AU,FS,auth,db};return FB}

 const w=[FS.setDoc(FS.doc(db,'users',uid),{v:1,data:JSON.stringify(rest),updated:FS.serverTimestamp()})];

 try{snap=await FS.getDoc(ref)}catch(e){try{snap=await FS.getDocFromCache(ref)}catch(_){}}

  if(!S){OB=OB0();const nm=USER.displayName||LG.name;if(nm)OB.p.nombre=nm.split(' ')[0]}}}
async function startAuth(){
 try{const {AU,auth}=await fbInit();

 catch(e){// sin internet la primera vez: modo local

function authMsg(e){const c=(e&&e.code)||'';return ({'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'No hay una cuenta con ese correo.',

function pwErr(p){if(p.length<8)return 'La contraseña debe tener al menos 8 caracteres.';if(!/[A-Za-zÁÉÍÓÚáéíóúñÑ]/.test(p)||!/\d/.test(p))return 'Usa letras y números en la contraseña.';return ''}
function renderLogin(){$('#nav').innerHTML='';const c=LG.mode==='crear';
 $('#app').innerHTML=`<div class="wrap" style="padding-top:28px;max-width:420px"><div style="text-align:center"><div style="font-size:54px">🔥</div><h1>FORJA</h1><p class="mut sm">Tu entrenador diario. Inicia sesión una vez y quedará abierta en este dispositivo.</p></div>
 <button class="btn" style="margin-top:20px;background:#fff;color:#222" onclick="loginGoogle()"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Continuar con Google</button>

/* =================== ANÁLISIS CORPORAL =================== */
function analyze(p){
 const h=+p.altura,w=+p.peso,a=+p.edad,male=p.sexo==='h';
 const bmi=w/((h/100)**2);
 let bf=null;
 if(p.cintura&&p.cuello){
  if(male&&p.cintura-p.cuello>0)bf=495/(1.0324-0.19077*Math.log10(p.cintura-p.cuello)+0.15456*Math.log10(h))-450;
  if(!male&&p.cadera&&(+p.cintura+ +p.cadera-p.cuello)>0)bf=495/(1.29579-0.35004*Math.log10(+p.cintura+ +p.cadera-p.cuello)+0.221*Math.log10(h))-450;
  if(bf!==null&&(bf<3||bf>60))bf=null;
 }
 const whtr=p.cintura?p.cintura/h:null;
 const bmr=10*w+6.25*h-5*a+(male?5:-161);
 const act=Math.min(1.9,+p.actividad+0.025*(+p.dias));
 const tdee=bmr*act;
 const gf={perder:0.8,recomp:0.9,ganar:1.1}[p.objetivo];
 let kcal=Math.round(tdee*gf/10)*10;kcal=Math.max(kcal,male?1500:1200,Math.round(bmr/10)*10);
 const ref=bmi>30?25*(h/100)**2:w;
 const prot=Math.round(ref*(p.objetivo==='ganar'?1.8:2.0));
 const fat=Math.round(kcal*0.27/9);
 const carb=Math.max(50,Math.round((kcal-prot*4-fat*9)/4));
 const water=r1(w*0.035+0.5);
 const pts=(p.flex<5?0:p.flex<15?1:2)+(p.sent<25?0:p.sent<40?1:2)+(p.plank<30?0:p.plank<60?1:2);
 const lvl=pts<=1?0:pts<=4?1:2;
 const leanMass=bf!==null?w*(1-bf/100):null;
 const notes=[];
 const bmiC=bmi<18.5?['Bajo peso','warn']:bmi<25?['Normal','ok']:bmi<30?['Sobrepeso','warn']:['Obesidad','bad'];
 let bfC=null;if(bf!==null){const t=male?[14,20,25]:[21,28,32];bfC=bf<t[0]?['Atlético','ok']:bf<t[1]?['En forma','ok']:bf<t[2]?['Promedio','warn']:['Alto','bad']}
 const whC=whtr===null?null:whtr<0.5?['Saludable','ok']:whtr<0.6?['Riesgo aumentado','warn']:['Riesgo alto','bad'];
 if(whtr&&whtr>=0.5)notes.push(`Tu cintura es el ${Math.round(whtr*100)}% de tu estatura. La meta es menos del 50% (≤ ${Math.round(h*0.5)} cm). La grasa abdominal es la de mayor riesgo metabólico: <b>prioridad #1 es bajarla</b>.`);
 if(bf!==null&&bfC[1]==='bad'&&p.objetivo==='ganar')notes.push('Con tu % de grasa actual, conviene empezar con <b>recomposición</b> (déficit leve + fuerza) antes de un superávit para ganar músculo.');
 if(p.flex<5)notes.push('Tu fuerza de empuje es baja: empezarás con flexiones con rodillas. En 4–6 semanas deberías hacer flexiones completas.');
 if(p.plank<30)notes.push('Core débil (plancha < 30 s): protegerá tu espalda fortalecerlo. Cada día lleva trabajo de core.');
 if(p.sent<25)notes.push('Resistencia de piernas baja: las sentadillas serán tu base.');
 if(+p.actividad<=1.2)notes.push('Eres muy sedentario fuera del entrenamiento: los <b>pasos diarios</b> queman más que el ejercicio mismo. No los ignores.');
 if(p.objetivo==='perder'||p.objetivo==='recomp')notes.push(`Ritmo realista y sostenible: perder ~${r1(w*0.006)} kg/semana (0,5–1% del peso). Más rápido = pierdes músculo y rebote.`);
 if(p.objetivo==='ganar')notes.push('Ganancia realista de un principiante: 0,5–1 kg de músculo al mes los primeros meses, con proteína alta y progresión.');
 return {bmi,bf,whtr,bmr,tdee,kcal,prot,fat,carb,water,lvl,pts,leanMass,bmiC,bfC,whC,notes,steps:p.objetivo==='perder'?10000:8000};
}

/* =================== GENERADOR DE RUTINAS =================== */
function progInfo(key=today()){const idx=Math.max(0,diffDays(S.start,key));const week=Math.floor(idx/7)+1;const phase=week<=4?0:week<=8?1:2;const bonus=week>12?1+0.05*Math.floor((week-13)/4+1):1;const type=W()[idx%7];return {idx,week,phase,bonus,type,day:idx+1}}
function sub(id){for(const z of (S.p.lesiones||[])){if(SUBS[z]&&SUBS[z][id])id=SUBS[z][id]}return id}
function dose(id,lvl,mult){if(REPS[id])return {mode:'reps',reps:Math.max(3,Math.round(REPS[id][lvl]*mult))};return {mode:'time',secs:Math.max(10,Math.round(SECS[id][lvl]*mult/5)*5)}}
function estimate(steps){return steps.reduce((t,s)=>t+(s.kind==='rest'?s.secs:s.mode==='time'?s.secs:(s.repN||s.reps)*(EX[s.ex].side?7:3.5)),0)}
function buildGym(type,info){
 const lvl=S.lvl,ph=info.phase,en=S.p.enfoque||'equilibrado';
 const G={F1:en==='gluteo'?['hip_thrust','sentadilla_barra','jalon','remo_mancuerna','patada','plancha']:['sentadilla_barra','press_banca','remo_mancuerna','hip_thrust','press_militar','plancha'],
  F2:en==='gluteo'?['peso_muerto','sentadilla_sumo','press_militar','zancada','almeja','deadbug']:['peso_muerto','jalon','press_militar','zancada','curl','triceps'],
  U:['press_banca','jalon','press_militar','remo_mancuerna','elev_lat','curl','triceps'],
  L:en==='gluteo'?['hip_thrust','sentadilla_sumo','peso_muerto','zancada','patada','almeja']:['sentadilla_barra','peso_muerto','prensa','hip_thrust','talones','plancha'],
  P:['press_banca','press_militar','elev_lat','triceps','flexion','plancha'],
  T:['peso_muerto','jalon','remo_mancuerna','curl','superman','deadbug']}[type];
 let exs=[...new Set(G.map(sub))];
 const rir=['deja 3 repeticiones en reserva','deja 2 repeticiones en reserva','deja 1 repetición en reserva'][ph];
 const mult=(1+0.15*ph)*info.bonus*(S.adj||1);
 let cap=9;const short=S.p.minutos<=30;
 const mk=list=>{const o=[];list.forEach((id,j)=>{const comp=EX[id].comp;const sets=Math.min(cap,comp?[[3,3,4],[3,4,4],[4,4,5]][lvl][ph]:3);const rest=comp?(ph===0&&!short?120:90):(short?45:60);
  const d=GYMR[id]?{mode:'reps',reps:GYMR[id][0]+'–'+GYMR[id][1],repN:GYMR[id][1],gym:1,note:rir}:dose(id,lvl,mult);
  for(let s=1;s<=sets;s++){o.push({kind:'work',ex:id,...d,label:`Ejercicio ${j+1}/${list.length} · Serie ${s}/${sets}`,ph:'Bloque principal'});o.push({kind:'rest',secs:rest,ph:'Descanso'})}});return o};
 let main=mk(exs);while(estimate(main)>(S.p.minutos-6)*60){if(exs.length>4)exs.pop();else if(cap>2)cap--;else break;main=mk(exs)}
 if(main.length&&main[main.length-1].kind==='rest')main.pop();
 const steps=[...warmup(),...main,...cooldown()];
 return {title:TYPES[type].i+' '+TYPES[type].t,type,steps,mins:Math.round(estimate(steps)/60),gym:1};
}
function warmup(){const L=[['jack',30],['bisagra',30],['sentadilla',30],['birddog',30],['rodillas',20]];const out=[];L.forEach(([id,s],i)=>{id=sub(id);out.push({kind:'work',ex:id,mode:'time',secs:s,label:'Calentamiento '+(i+1)+'/'+L.length,ph:'Calentamiento'});out.push({kind:'rest',secs:5,ph:'Calentamiento'})});return out}
function cooldown(){return [{kind:'work',ex:'respiracion',mode:'time',secs:90,label:'Vuelta a la calma',ph:'Vuelta a la calma'}]}
function buildWorkout(type,info=progInfo()){
 if(GYMT.includes(type))return buildGym(type,info);
 const lvl=S.lvl,ph=info.phase,mult=(1+0.15*ph)*info.bonus*(S.adj||1);
 const title=TYPES[type].i+' '+TYPES[type].t;
 let main=[];
 if(type==='C'){
  const exs=[['jack','sentadilla','escalador','rodillas','plancha'],['jack','escalador','sentadilla','rodillas','flexion_rod','burpee'],['burpee','sent_salto','escalador','rodillas','flexion','jack']][lvl].map(sub);
  const wr=[[20,40],[30,30],[40,20]][lvl===0?Math.min(ph,1):ph];let rounds=[3,4,5][lvl];
  const mk=r=>{const o=[];for(let k=1;k<=r;k++){exs.forEach((id,j)=>{o.push({kind:'work',ex:id,mode:'time',secs:wr[0],label:`Ronda ${k}/${r} · ${j+1}/${exs.length}`,ph:'HIIT',hiit:1});o.push({kind:'rest',secs:wr[1],ph:'HIIT'})});if(k<r)o.push({kind:'rest',secs:60,ph:'Descanso entre rondas'})}return o};
  main=mk(rounds);while(rounds>2&&estimate(main)>(S.p.minutos-6)*60){rounds--;main=mk(rounds)}
 } else {
  const en=S.p.enfoque||'equilibrado',push=lvl===0?'flexion_rod':'flexion';
  let exs={A:en==='gluteo'?['hip_sofa','sentadilla_sumo','zancada','patada','almeja','puente_1p']:[lvl===2?'sent_salto':'sentadilla','zancada','puente','pared','talones','deadbug'],
   B:lvl===0?['flexion_rod','superman','plancha','birddog','plancha_lat']:['flexion','pica','superman','plancha','plancha_lat','birddog'],
   D:en==='gluteo'?[push,'hip_sofa','sentadilla','superman','patada','plancha']:en==='superior'?[push,lvl===0?'superman':'pica','sentadilla','birddog','plancha','plancha_lat']:[push,'sentadilla','superman','zancada','escalador','plancha'],
   M:en==='gluteo'?['bisagra','almeja','deadbug','puente_1p','plancha_lat']:['bisagra','birddog','deadbug','puente','plancha_lat'],R:['bisagra','birddog','deadbug','puente']}[type].map(sub);
  exs=[...new Set(exs)];
  const light=type==='M'||type==='R';
  const sets=light?(type==='R'?1:2):[[2,3,3],[3,3,4],[3,4,4]][lvl][ph];
  const rest=light?20:[60,45,30][ph]+(lvl===0?15:0);
  const mk=list=>{const o=[];list.forEach((id,j)=>{const d=dose(id,lvl,light?mult*0.8:mult);for(let s=1;s<=sets;s++){o.push({kind:'work',ex:id,...d,label:`Ejercicio ${j+1}/${list.length} · Serie ${s}/${sets}`,ph:'Bloque principal'});o.push({kind:'rest',secs:rest,ph:'Descanso'})}});return o};
  main=mk(exs);while(exs.length>4&&estimate(main)>(S.p.minutos-6)*60){exs.pop();main=mk(exs)}
 }

function ang(a,b,c){const x1=a.x-b.x,y1=a.y-b.y,x2=c.x-b.x,y2=c.y-b.y;const d=(x1*x2+y1*y2)/((Math.hypot(x1,y1)*Math.hypot(x2,y2))||1);return Math.acos(Math.max(-1,Math.min(1,d)))*180/Math.PI}
const visOk=(lm,ids)=>ids.every(i=>lm[i]&&(lm[i].visibility??1)>0.5);
function sideOf(lm){const s=k=>Object.values(SIDES[k]).reduce((t,i)=>t+(lm[i]?.visibility??0),0);return SIDES[s('L')>=s('R')?'L':'R']}
function hipSag(lm,s,end){const a=lm[s.sh],b=lm[s[end]],h=lm[s.hip];const t=(h.x-a.x)/((b.x-a.x)||1e-6);const yl=a.y+(b.y-a.y)*t;return h.y<yl?'Baja un poco la cadera.':'Sube la cadera: aprieta abdomen y glúteos.'}

  live:(l,s)=>{const t=Math.abs(Math.atan2(l[s.sh].x-l[s.hip].x,l[s.hip].y-l[s.sh].y)*180/Math.PI);return t>55?'Pecho arriba, no te inclines tanto.':null},part:'Baja más: muslos paralelos al piso.'},
 lunge:{need:()=>[23,24,25,26,27,28],val:l=>Math.min(ang(l[23],l[25],l[27]),ang(l[24],l[26],l[28])),rest:v=>v>150,work:v=>v<105,ext:'min',tip:'De lado a 2–3 m, cuerpo completo visible.',part:'Baja más, la rodilla de atrás casi al piso.'},

 press:{need:s=>[s.sh,s.el,s.wr],val:(l,s)=>ang(l[s.sh],l[s.el],l[s.wr]),rest:v=>v<100,work:(v,l,s)=>v>155&&l[s.wr].y<l[s.sh].y,ext:'max',tip:'De frente o de lado: torso y brazos visibles.',part:'Estira por completo los brazos arriba.'},
 curl:{need:s=>[s.sh,s.el,s.wr,s.hip],val:(l,s)=>ang(l[s.sh],l[s.el],l[s.wr]),rest:v=>v>140,work:v=>v<60,ext:'min',tip:'De lado: brazo completo visible.',

 jack:{need:()=>[0,11,12,15,16],val:l=>(l[15].y+l[16].y)/2-(l[11].y+l[12].y)/2,rest:v=>v>0.05,work:(v,l)=>l[15].y<l[0].y&&l[16].y<l[0].y,ext:'min',tip:'De frente a 2–3 m, cuerpo completo visible.',part:'Sube los brazos por encima de la cabeza.'},

  live:(l)=>(ang(l[23],l[11],l[13])+ang(l[24],l[12],l[14]))/2>110?'Solo hasta la altura de los hombros.':null,part:'Sube hasta la altura de los hombros.'},

const CAMEX={sentadilla:'knee',sentadilla_sumo:'knee',sentadilla_barra:'knee',sent_salto:'knee',zancada:'lunge',flexion:'push',pica:'push',flexion_rod:'pushk',

const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
async function openCam(exId,target,onDone){const K=CAMK[CAMEX[exId]];if(!K)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Este navegador no permite usar la cámara aquí. Abre FORJA desde su dirección https en Chrome o Safari.');return}
 if(PL)PL.paused=true;closeL();
 const side=EX[exId].side&&!K.hold;const tgt=K.hold?target:(side?target*2:target);
 const w=document.createElement('div');w.id='cam';w.className='overlay';w.style.zIndex=30;
 w.innerHTML=`<div style="position:relative;max-width:560px;margin:0 auto;background:#000"><video id="cv" playsinline muted style="width:100%;display:block"></video><canvas id="cc" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
 <div style="position:absolute;top:10px;left:10px;right:10px" class="row sp"><span class="pill ac">${esc(EX[exId].n)}</span><button class="btn sm ghost" style="background:#000a" onclick="stopCam()">✕</button></div>
 <div style="position:absolute;bottom:10px;left:10px;right:10px;text-align:center"><div id="ccount" class="timer" style="text-shadow:0 2px 12px #000">0${tgt?' / '+tgt:''}</div>
 <div id="cfb" style="font-weight:800;font-size:18px;background:#000b;border-radius:10px;padding:8px;margin-top:6px">Cargando tu entrenador… (la primera vez descarga ~6 MB)</div></div></div>
 <div class="wrap"><div class="row"><button class="btn ghost" onclick="flipCam()">🔄 Cambiar cámara</button><button class="btn ok" onclick="camComplete(true)">✓ Terminar serie</button></div>
 <p class="sm mut" style="margin-top:8px">📷 ${esc(K.tip)}${side?' Cuenta las repeticiones de ambos lados.':''}</p><p class="sm mut">🔒 El video se analiza solo en tu dispositivo: no se graba ni se envía a ningún servidor.</p></div>`;
 document.body.appendChild(w);
 CAM={exId,K,target:tgt,onDone,reps:0,good:0,state:'rest',ext:null,inRep:false,lastSay:0,facing:'user',raf:0,lastT:0,hold:0,prevT:0,bad:false};
 try{await startStream();await loadLandmarker();if(CAM){camFb('Listo. ¡Empieza cuando quieras!','ok');speak('Listo. Empieza.');camLoop()}}
 catch(e){if(CAM)camFb(e&&e.name==='NotAllowedError'?'Sin permiso de cámara. Actívalo en el candado de la barra de direcciones.':'No se pudo iniciar la cámara o descargar el modelo. Revisa tu conexión.','bad');console.error(e)}}
async function startStream(){if(!CAM)return;if(CAM.stream)CAM.stream.getTracks().forEach(t=>t.stop());

 const v=$('#cv');v.srcObject=CAM.stream;const m=CAM.facing==='user'?'scaleX(-1)':'none';v.style.transform=m;$('#cc').style.transform=m;await v.play()}

function camLoop(){if(!CAM)return;const v=$('#cv');
 if(v&&v.readyState>=2&&LANDMARKER){const now=performance.now();if(now-CAM.lastT>=45){CAM.lastT=now;let r=null;try{r=LANDMARKER.detectForVideo(v,now)}catch(e){}

function drawPose(lm,v){const c=$('#cc');if(!c)return;c.width=v.videoWidth;c.height=v.videoHeight;const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);if(!lm)return;

function camFb(t,k){const e=$('#cfb');if(!e)return;e.textContent=t;e.style.color=k==='ok'?'#35d07f':k==='bad'?'#ff5a5f':'#ffcc33'}

function camStep(lm,now){const C=CAM,K=C.K,s=sideOf(lm);
 if(!visOk(lm,K.need(s))){C.bad=true;camFb('Muévete para que se vea tu cuerpo. '+K.tip,'warn');camSay('Muévete para que te vea completo.',now);return}
 const v=K.val(lm,s);
 if(K.hold){const ok=K.good(v);const dt=C.prevT?Math.min(.25,(now-C.prevT)/1000):0;C.prevT=now;C.bad=!ok;
  if(ok){C.hold+=dt;camFb('¡Perfecto! Mantén la posición 💪','ok')}else{const b=K.bad(lm,s);camFb(b+' (el tiempo se pausa)','bad');camSay(b,now)}
  const sec=Math.floor(C.hold);if(sec!==C.reps){C.reps=sec;$('#ccount').textContent=sec+' / '+C.target+' s';if(sec>0&&sec%10===0)speak(sec+' segundos')}
  if(C.hold>=C.target)camComplete();return}

 const upd=x=>C.ext===null?x:(K.ext==='min'?Math.min(C.ext,x):Math.max(C.ext,x));
 if(C.state==='rest'){
  if(K.work(v,lm,s)){C.state='work';C.ext=upd(v);C.cleanRep=!live}
  else if(!K.rest(v,lm,s)){C.inRep=true;C.ext=upd(v);if(live)C.cleanRep=false}
  else if(C.inRep){C.inRep=false;C.ext=null;camFb(K.part,'warn');camSay('Rango incompleto. '+K.part,now)}}
 else{C.ext=upd(v);if(live)C.cleanRep=false;
  if(K.rest(v,lm,s)){C.state='rest';C.inRep=false;C.ext=null;C.reps++;if(C.cleanRep!==false)C.good++;
   $('#ccount').textContent=C.reps+(C.target?' / '+C.target:'');speak(String(C.reps));C.lastSay=now-2000;
   if(!live)camFb(C.cleanRep===false?'Cuenta, pero cuida la técnica.':'¡Buena repetición! ✅',C.cleanRep===false?'warn':'ok');
   if(C.target&&C.reps>=C.target)camComplete()}}}
function camComplete(manual){if(!CAM)return;const C=CAM;if(!manual||C.reps)speak(C.K.hold?'¡Tiempo completo! Excelente.':`¡Serie completa! ${C.good} de ${C.reps} con técnica perfecta.`);

function frac(x){const r=Math.max(.25,Math.round(x*4)/4),w=Math.floor(r),f={0:'',.25:'¼',.5:'½',.75:'¾'}[r-w];return w?w+(f?' '+f:''):f}
function fq(id,q){const F=FOOD[id];if(F.u==='x')return F.n;if(F.u==='g')return `${Math.max(10,Math.round(q*F.g/10)*10)} g de ${F.n}`;
 const a=q*(F.per||1);if(F.u==='taza')return `${frac(a)} taza${a>1.1?'s':''} de ${F.n}`;if(F.u==='vaso')return `${frac(a)} vaso${a>1.1?'s':''} de ${F.n}`;if(F.u==='cda')return `${Math.max(1,Math.round(a))} cda de ${F.n}`;
 if(F.int){const n=Math.max(1,Math.round(a));return `${n} ${n===1?F.n:F.pl||F.n}`}return `${frac(a)} ${a>1.1?(F.pl||F.n):F.n}`}
function mealFor(slot,k=today()){const L=MEALS[slot].filter(m=>S.p.dieta!=='veg'||!m.meat);const d=S.days&&S.days[k];const off=(d&&d.menu&&d.menu[slot])||0;
 const m=L[(progInfo(k).idx+MOFF[slot]+off)%L.length];const base=Object.entries(m.i).reduce((t,[id,q])=>t+FOOD[id].K*q,0);
 const f=Math.min(1.8,Math.max(.6,S.A.kcal*MSPLIT[slot]/base));const items=Object.entries(m.i).map(([id,q])=>[id,FOOD[id].int?Math.max(1,Math.round(q*f)):q*f]);
 return {n:m.n,items,kcal:Math.round(items.reduce((t,[id,q])=>t+FOOD[id].K*q,0)),P:Math.round(items.reduce((t,[id,q])=>t+FOOD[id].P*q,0))}}
function swapMeal(slot){const d=D();d.menu=d.menu||{};d.menu[slot]=((d.menu[slot]||0)+1)%20;save();render()}
function ateMeal(slot){const d=D();d.ate=d.ate||{};d.ate[slot]=!d.ate[slot];save();render()}
function menuCard(full){const d=D(),ms=['B','L','M','C'].map(s=>[s,mealFor(s)]);const tk=ms.reduce((t,[,m])=>t+m.kcal,0),tp=ms.reduce((t,[,m])=>t+m.P,0);
 if(!full)return `<div class="card"><div class="row sp"><h2>🍽️ Menú de hoy</h2><button class="btn sm ghost" onclick="go('comida')">Ver detalle</button></div>${ms.map(([s,m])=>`<div class="chk ${d.ate&&d.ate[s]?'on':''}" onclick="ateMeal('${s}')"><div class="box">${d.ate&&d.ate[s]?'✓':''}</div><span class="t"><b>${MEALN[s].split(' ')[0]}</b> ${m.n}</span></div>`).join('')}<p class="sm mut" style="margin-top:6px">~${tk} kcal · ${tp} g de proteína (meta ${S.A.kcal} kcal · ${S.A.prot} g)</p></div>`;
 return `<div class="card"><div class="row sp"><h2>🍽️ Menú de hoy</h2><div class="row"><button class="btn sm ${S.p.dieta!=='veg'?'pri':'ghost'}" onclick="setDiet('normal')">Normal</button><button class="btn sm ${S.p.dieta==='veg'?'pri':'ghost'}" onclick="setDiet('veg')">🌱 Vegetariano</button></div></div>
 <p class="sm mut">Porciones calculadas para tu meta de ${S.A.kcal} kcal. Cambia cualquier comida si no te gusta o no la tienes.</p>
 ${ms.map(([s,m])=>`<div style="border-top:1px solid var(--line);padding:10px 0"><div class="row sp"><b>${MEALN[s]}</b><span class="pill">${m.kcal} kcal · ${m.P} g prot.</span></div><p style="margin:4px 0;font-weight:700">${m.n}</p><ul class="sm" style="padding-left:18px">${m.items.map(([id,q])=>`<li>${fq(id,q)}</li>`).join('')}</ul>
 <div class="row" style="margin-top:6px"><button class="btn sm ghost" onclick="swapMeal('${s}')">🔄 Otra opción</button><button class="btn sm ${d.ate&&d.ate[s]?'ok':'ghost'}" onclick="ateMeal('${s}')">${d.ate&&d.ate[s]?'✓ Comido':'Lo comí'}</button></div></div>`).join('')}
 <p class="sm" style="margin-top:6px"><b>Total: ~${tk} kcal · ${tp} g de proteína</b> <span class="mut">(meta ${S.A.kcal} kcal · ${S.A.prot} g)</span>${tp<S.A.prot*.85?'<br><span style="color:var(--warn)">Te falta proteína: agrega un yogur griego, huevos o una porción más de carne/pollo.</span>':''}</p></div>
 <details class="card"><summary><b>🛒 Lista de compras para 7 días</b></summary>${shopList()}</details>`}
function setDiet(x){S.p.dieta=x;save();render()}
function shopList(){const tot={};for(let i=0;i<7;i++){const k=addDays(today(),i);for(const s of ['B','L','M','C'])for(const [id,q] of mealFor(s,k).items)tot[id]=(tot[id]||0)+q}
 return `<ul class="sm" style="padding-left:18px;margin-top:8px">${Object.entries(tot).filter(([id])=>id!=='cafe').sort((a,b)=>FOOD[a[0]].n.localeCompare(FOOD[b[0]].n)).map(([id,q])=>`<li>${fq(id,q)}</li>`).join('')}</ul><p class="sm mut">Cantidades aproximadas en cocido; compra un poco más de verduras y fruta.</p>`}

async function obNav(dir){
 const p=OB.p;const g=id=>{const e=$('#f_'+id);return e?e.value.trim():undefined};
 const need=(ids)=>{for(const i of ids){const v=g(i);if(v===''||v===undefined){alert('Completa: '+i);return false}}return true};
 if(dir>0){
  if(OB.step===0){if(!need(['nombre','edad','altura','peso']))return;Object.assign(p,{nombre:g('nombre'),sexo:g('sexo'),edad:+g('edad'),altura:+g('altura'),peso:+g('peso')});if(p.altura<120||p.altura>230||p.peso<30||p.peso>300){alert('Revisa altura (cm) y peso (kg).');return}}
  if(OB.step===1){if(!need(p.sexo==='m'?['cintura','cuello','cadera']:['cintura','cuello']))return;p.cintura=+g('cintura');p.cuello=+g('cuello');if(p.sexo==='m')p.cadera=+g('cadera')}
  if(OB.step===2){if(!need(['flex','sent','plank']))return;p.flex=+g('flex');p.sent=+g('sent');p.plank=+g('plank')}
  if(OB.step===3){Object.assign(p,{objetivo:g('objetivo'),actividad:g('actividad'),dias:g('dias'),minutos:+g('minutos'),lugar:g('lugar'),enfoque:g('enfoque'),lesiones:[...document.querySelectorAll('.f_les:checked')].map(e=>e.value)})}
  if(OB.step===4){p.why=g('why');p.hora=g('hora');if(!p.why){alert('Escribe tu porqué. Es lo que te va a sostener los días difíciles.');return}if(!g('firma')){alert('Firma tu contrato.');return}
   S={p,start:today(),signed:g('firma'),days:{},logs:[{d:today(),peso:p.peso,cintura:p.cintura}],tests:[{d:today(),flex:p.flex,sent:p.sent,plank:p.plank}],sessions:[],adj:1,voz:true,splash:today(),autolock:5};
   S.A=analyze(p);S.lvl=S.A.lvl;save();TAB='cuerpo';render();return}
 }
 OB.step=Math.max(0,OB.step+dir);renderOnboarding();
}

function weekStrip(){const info=progInfo();const startIdx=info.idx-((info.idx)%7);let h='<div class="heat">';for(let i=0;i<7;i++){const k=addDays(S.start,startIdx+i);const t=W()[i];const c=diffDays(k,today())<0?'f':done(k)?'d':k===today()?'':'x';h+=`<div style="text-align:center"><i class="${c} ${k===today()?'t':''}" style="display:grid;place-items:center;font-size:14px">${TYPES[t].i}</i></div>`}return h+'</div><p class="sm mut" style="margin-top:8px">Verde = cumplido · Rojo = fallado · Punteado = próximo</p>'}

V.cuerpo=()=>{

 return `<h1>🧍 Análisis corporal</h1><p class="mut sm">Basado en tus medidas del ${lastW?lastW.d:''}. Actualízalas en 📈 Progreso cada semana.</p>

  <div class="stat"><span class="sm mut">Masa magra</span><b>${A.leanMass?r1(A.leanMass)+' kg':'—'}</b><span class="sm mut">${A.bf!==null?r1(p.peso-A.leanMass)+' kg de grasa':''}</span></div>
  <div class="stat"><span class="sm mut">Metabolismo basal</span><b>${Math.round(A.bmr)}</b><span class="sm mut">kcal/día</span></div>

 <div class="card"><h2>Diagnóstico de tu entrenador</h2>

  ${PHASES.map((t,i)=>`<div class="${info.phase===i?'on':''}"><b>${t}</b><div class="sm mut">${['Técnica, hábito y base. Volumen moderado, descansos largos. Meta: no fallar ni un día.','Más series y repeticiones (+15%), descansos más cortos, HIIT más intenso.','Máxima densidad: +30% de volumen, descansos de 30 s, variantes más difíciles. Re-test final.'][i]}</div></div>`).join('')}

function womenCard(inner){return `<div ${inner?'':'class="card"'} style="${inner?'margin-top:10px':'border-color:#ff6fb066'}">${inner?'':'<h2>♀️ Tu plan como mujer</h2>'}
 <p>Tu plan ya está ajustado a ti: calorías calculadas para mujer, % de grasa con cadera, y enfoque <b>${ENF[S.p.enfoque||'equilibrado']}</b> (cámbialo en ⚙️ Ajustes).</p>
 <h3>🍑 Glúteos y piernas</h3><p class="sm">El enfoque "Glúteos y piernas" prioriza hip thrust, sentadilla sumo, patada, almeja y puente a una pierna, de 2 a 3 veces por semana. El glúteo responde a volumen (series semanales) y a progresión: sube repeticiones o peso cada semana.</p>
 <h3>💪 "No quiero ponerme grande"</h3><p class="sm">Entrenar fuerza no te va a poner "voluminosa": las mujeres tienen mucha menos testosterona que los hombres. Lo que consigues es <b>firmeza, forma y menos grasa</b>. Las pesas son tu mejor aliada, no solo el cardio.</p>
 <h3>🌙 Ciclo menstrual</h3><p class="sm">Puedes entrenar durante todo el ciclo. Si algunos días tienes menos energía, dolor o hinchazón, haz el <b>Plan mínimo</b> o Movilidad: también cuenta para tu racha. No hay evidencia sólida para cambiar todo el plan según la fase; escucha tu cuerpo.</p>
 <h3>🌸 Suelo pélvico</h3><p class="sm">Tienes un hábito diario de Kegel: aprieta como si cortaras la orina, mantén 5 s, suelta 5 s, 10 veces, 3 veces al día. Si tienes escapes de orina al saltar o toser, consulta a un fisioterapeuta de suelo pélvico y cambia los saltos por versiones sin impacto.</p>
 <h3>🤰 Embarazo y posparto</h3><p class="sm">Si estás embarazada o tuviste un bebé hace menos de 6 meses, <b>no sigas este plan sin la aprobación de tu médico</b>. En el posparto, revisa la diástasis abdominal antes de hacer planchas o abdominales intensos.</p>
 <h3>🥩 Nutrición</h3><p class="sm"><b>Proteína</b> 1,6–2,2 g/kg (ya calculada). <b>Hierro</b>: carnes rojas, hígado, lentejas y frijoles con vitamina C (limón, guayaba). <b>Calcio</b>: lácteos, queso, sardinas. No bajes de ${S.A.kcal} kcal: comer muy poco frena tu progreso y puede alterar tu ciclo.</p>
 <h3>🦴 Más de 40 o menopausia</h3><p class="sm">La fuerza y algo de impacto (saltos suaves, caminar rápido) protegen tus huesos y músculos. Es la etapa en la que más importa entrenar.</p></div>`}
const exCards=ids=>`<div class="exgrid" style="margin-top:12px">${ids.map(id=>`<div class="excard" onclick="exModal('${id}')">${figSVG(id,140)}<b class="sm">${EX[id].n}</b><div class="sm mut">${EX[id].m}</div></div>`).join('')}</div>`;

 <div class="row" style="margin-top:10px">${[['casa','🏠 Casa'],['gluteo','🍑 Glúteo'],['gym','🏋️ Gimnasio']].map(([k,t])=>`<button class="btn sm ${EXT===k?'pri':'ghost'}" style="flex:1" onclick="EXT='${k}';render()">${t}</button>`).join('')}</div>
 ${EXT==='gym'?'<p class="sm mut" style="margin-top:10px">En el gimnasio trabajas por rangos (ej. 8–12) y anotas el peso de cada serie. Cuando completes el tope en todas las series, sube el peso: eso es <b>sobrecarga progresiva</b>, la clave del cambio físico.</p>':''}

V.comida=()=>{const A=S.A,m=S.p.sexo==='h';const meals=4;

 <div class="card"><h2>Tus números diarios</h2><div class="grid2"><div class="stat"><b>${A.kcal}</b><span class="sm mut">kcal</span></div><div class="stat"><b>${A.prot} g</b><span class="sm mut">proteína</span></div><div class="stat"><b>${A.carb} g</b><span class="sm mut">carbohidratos</span></div><div class="stat"><b>${A.fat} g</b><span class="sm mut">grasas</span></div></div>
 <p class="sm mut" style="margin-top:8px">Por comida (${meals} comidas): ~${Math.round(A.prot/meals)} g proteína · ${Math.round(A.kcal/meals)} kcal. Agua: ${A.water} L. Fibra: 25–35 g.</p></div>
 ${menuCard(true)}
 <div class="card"><h2>✋ Método de la mano (sin pesar comida)</h2><p class="sm mut">Por cada comida principal (${m?'hombre':'mujer'}):</p><table>
  <tr><td>🖐️ Proteína</td><td><b>${m?2:1} palma${m?'s':''}</b> (grosor y tamaño de tu palma)</td></tr>
  <tr><td>✊ Verduras</td><td><b>${m?2:1} puño${m?'s':''}</b> o más</td></tr>
  <tr><td>🤲 Carbohidratos</td><td><b>${S.p.objetivo==='perder'?(m?'1':'½'):(m?'2':'1')} mano${m&&S.p.objetivo!=='perder'?'s':''} ahuecada${m&&S.p.objetivo!=='perder'?'s':''}</b>${S.p.objetivo==='perder'?' (más cerca del entreno)':''}</td></tr>
  <tr><td>👍 Grasas</td><td><b>${m?2:1} pulgar${m?'es':''}</b></td></tr></table></div>
 <div class="card"><h2>Qué comer</h2>
  <h3>🥩 Proteína (en CADA comida)</h3><p class="sm">Huevos, pechuga de pollo, carne magra de res/cerdo, atún, sardinas, tilapia, queso campesino, yogur griego/kumis sin azúcar, lentejas, frijoles, garbanzos.</p>
  <h3>🍚 Carbohidratos (porción controlada)</h3><p class="sm">Arroz, papa, yuca, plátano, arepa, avena, pan integral, frutas enteras (banano, mango, papaya, guayaba).</p>
  <h3>🥑 Grasas</h3><p class="sm">Aguacate, maní, nueces, aceite de oliva, huevo.</p>
  <h3>🥦 Verduras (sin límite)</h3><p class="sm">Tomate, cebolla, lechuga, repollo, brócoli, zanahoria, habichuela, ahuyama, espinaca, pepino.</p>
  <h3>🚫 Evitar casi siempre</h3><p class="sm">Gaseosa, jugos con azúcar, alcohol, paquetes, panadería, fritos diarios. No por moral: son calorías que no llenan.</p></div>
 <div class="card"><h2>Reglas que funcionan</h2><ol class="steps">
  <li>Proteína y verduras primero en el plato; carbohidrato al final.</li><li>Come despacio: 15–20 min por comida.</li><li>80/20: 80% comida real, 20% flexible. Una comida libre no daña nada.</li><li>Prepara la proteína de 3 días de una vez (domingo y miércoles).</li><li>Si el peso no baja en 2 semanas seguidas, reduce ½ porción de carbohidrato en la cena.</li></ol></div>
 <div class="card"><h2>💊 Suplementos (solo los que tienen evidencia)</h2><table>
  <tr><td><b>Creatina monohidrato</b></td><td>3–5 g/día, cualquier hora. La más estudiada para fuerza y músculo.</td></tr>
  <tr><td><b>Proteína en polvo</b></td><td>Solo si no llegas a tu proteína con comida. Es comida, no magia.</td></tr>
  <tr><td><b>Cafeína</b></td><td>Opcional, 1 café 30–60 min antes de entrenar. Nunca 8 h antes de dormir.</td></tr>
  <tr><td><b>Vitamina D</b></td><td>Solo si un examen muestra deficiencia.</td></tr></table>

let BR=null;
V.mente=()=>{const d=D(),info=progInfo();const P=JPROMPTS[info.idx%JPROMPTS.length];
 return `<h1>🧠 Mente</h1><p class="mut sm">Tu cuerpo cambia cuando tu cabeza no negocia. 5 minutos al día.</p>
 <div class="card"><h2>Respiración guiada</h2><div class="row"><button class="btn sm ${BRM==='caja'?'pri':'ghost'}" onclick="BRM='caja';render()">Caja 4-4-4-4 (foco)</button><button class="btn sm ${BRM==='suspiro'?'pri':'ghost'}" onclick="BRM='suspiro';render()">Suspiro fisiológico (calma rápida)</button></div>
  <div class="breath" id="breath">Listo</div><p class="timer" style="font-size:30px" id="brt">5:00</p>
  <button class="btn ${BR?'ghost':'pri'}" style="margin-top:10px" onclick="toggleBreath()">${BR?'Detener':'▶ Iniciar 5 minutos'}</button>
  <p class="sm mut" style="margin-top:8px">${BRM==='caja'?'Inhala 4 s · sostén 4 s · exhala 4 s · sostén 4 s. Mejora el foco y reduce la tensión.':'Dos inhalaciones por la nariz (una larga y otra corta para llenar) y una exhalación larga por la boca. Es de las técnicas más rápidas para bajar el estrés.'}</p></div>
 <div class="card"><h2>Diario de hoy ${d.h.diario?'✅':''}</h2>
  <label>1. Hoy agradezco…</label><textarea id="j1" rows="2">${esc(d.j.a||'')}</textarea>
  <label>2. ${P}</label><textarea id="j2" rows="2">${esc(d.j.b||'')}</textarea>
  <label>3. Mañana gano el día si…</label><textarea id="j3" rows="2">${esc(d.j.c||'')}</textarea>
  <button class="btn pri" style="margin-top:10px" onclick="saveJ()">Guardar diario</button></div>
 <div class="card"><h2>Identidad: tu frase de hoy</h2><p style="font-size:18px;font-weight:700">"${IDS[info.idx%IDS.length]}"</p><p class="sm mut">Los hábitos duran cuando cambian quién crees que eres. Cada sesión es un voto por esa persona.</p></div>
 <div class="card"><h2>Cuando quieras abandonar</h2><ol class="steps"><li><b>Regla de 2 minutos:</b> solo ponte la ropa y haz el calentamiento. Casi siempre terminas.</li><li><b>Nunca dos veces:</b> fallar un día es un accidente, fallar dos es el inicio de un nuevo hábito (el malo).</li><li><b>Plan mínimo:</b> 7 minutos cuentan. Cero no.</li><li><b>Relee tu porqué</b> en la pantalla de Hoy.</li><li>No esperes motivación: la motivación llega <i>después</i> de empezar.</li></ol></div>
 <div class="card"><h2>Sueño: tu arma secreta</h2><ul style="padding-left:18px" class="sm"><li>Misma hora de dormir y despertar, también fines de semana.</li><li>Luz del sol 10 min al despertar.</li><li>Cuarto oscuro, fresco y sin celular.</li><li>Nada de cafeína después de las 2 p.m.</li><li>Cena 2–3 h antes de dormir.</li></ul></div>
 <p class="sm mut">Si sientes tristeza o ansiedad persistente por más de 2 semanas, habla con un profesional de salud mental. Pedir ayuda también es entrenar.</p>`};
let BRM='caja';
const JPROMPTS=['¿Qué hice hoy que mi yo de hace un mes no habría hecho?','¿Qué excusa venció hoy y cuál venciste tú?','¿Qué parte de mi cuerpo noto más fuerte?','¿Qué comida elegí bien hoy y por qué?','¿Qué me costó más hoy y cómo lo superé?','¿Qué diría de mí alguien que me vio entrenar hoy?','¿Qué pensamiento negativo tuve y cuál es la respuesta realista?'];
const IDS=['Soy una persona que no falla dos días seguidos.','Soy disciplinado aunque no tenga ganas.','Entreno porque me respeto.','Mi cuerpo es el resultado de mis decisiones diarias.','No negocio con mis excusas.','Hago lo difícil primero.','Soy más fuerte que ayer.'];
function saveJ(){const d=D();d.j={a:$('#j1').value,b:$('#j2').value,c:$('#j3').value};if(d.j.a&&d.j.b&&d.j.c)d.h.diario=true;else alert('Completa las 3 líneas para marcar el hábito.');save();render()}
function toggleBreath(){
 if(BR){clearInterval(BR.iv);const el=BR.el;if(el>=120){D().h.respira=true;save()}BR=null;render();return}
 const seq=BRM==='caja'?[['Inhala',4,1],['Sostén',4,1],['Exhala',4,.55],['Sostén',4,.55]]:[['Inhala',2,.85],['Inhala más',1,1],['Exhala lento',6,.55]];
 BR={el:0,iv:null};render();let i=0,left=0;const tot=300;
 const step=()=>{const b=$('#breath');if(!b)return;if(left<=0){const s=seq[i%seq.length];i++;left=s[1];b.style.transitionDuration=s[1]+'s';b.style.transform=`scale(${s[2]})`;b.textContent=s[0];beep(s[0].startsWith('Inh')?520:390,90)}left--;BR.el++;const r=tot-BR.el;const t=$('#brt');if(t)t.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');if(r<=0){clearInterval(BR.iv);BR=null;D().h.respira=true;save();beep(1000,400);speak('Excelente. Respiración completada.');render()}};
 step();BR.iv=setInterval(step,1000);
}

V.progreso=()=>{const L=S.logs||[];const first=L[0],last=L[L.length-1];const info=progInfo();

let PL=null,WL=null;
async function startWorkout(kind){
 const w=kind==='min'?buildMin():buildWorkout(progInfo().type);
 PL={w,i:0,left:0,paused:false,kind,t0:Date.now()};
 try{WL=await navigator.wakeLock?.request('screen')}catch(e){}
 PL.iv=setInterval(tick,1000);enterStep();
}
function enterStep(){const s=PL.w.steps[PL.i];if(!s){finishWorkout();return}
 PL.left=s.kind==='rest'||s.mode==='time'?s.secs:0;renderPlayer();
 if(s.kind==='rest'){const n=PL.w.steps[PL.i+1];speak('Descansa. Siguiente: '+(n?EX[n.ex].n:'final'))}
 else speak(EX[s.ex].n+'. '+(s.mode==='reps'?s.reps+' repeticiones'+(EX[s.ex].side?' por lado':''):s.secs+' segundos'));
}
function tick(){if(!PL||PL.paused)return;const s=PL.w.steps[PL.i];if(!s||(s.kind==='work'&&s.mode==='reps'))return;PL.left--;if(PL.left<=3&&PL.left>0)beep(660,120);const t=$('#pl-time');if(t)t.textContent=fmt(PL.left);if(PL.left<=0){beep(1000,300);nextStep()}}
const fmt=s=>s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(Math.max(0,s));
function nextStep(){PL.i++;enterStep()}
function prevStep(){PL.i=Math.max(0,PL.i-1);if(PL.w.steps[PL.i].kind==='rest'&&PL.i>0)PL.i--;enterStep()}
function camBtn(s){const K=CAMK[CAMEX[s.ex]];if(!K||s.hiit||(s.mode==='time'&&!K.hold)||(s.mode==='reps'&&K.hold))return '';
 return `<button class="btn ghost" style="margin-top:12px;border-color:var(--blue);color:var(--blue)" onclick="openCam('${s.ex}',camTarget(PL.w.steps[PL.i]),camDoneStep)">📷 Que la cámara cuente y corrija</button>`}

  <p class="sm mut" style="text-align:center;margin-top:10px">Paso ${PL.i+1} de ${tot} · ${S.voz===false?'🔇':'🔊'} <a href="#" style="color:var(--mut)" onclick="S.voz=S.voz===false;save();renderPlayer();return false">voz</a></p></div></div>`;
 mountFigs($('#layer'));}

 S.sessions=S.sessions||[];S.sessions.push({d:today(),t:w.title.replace(/^\S+\s/,''),min});save();clearInterval(PL.iv);PL=null;try{WL&&WL.release()}catch(e){}
